<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Ops Hub (Auto-Sync)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .kanban-column { min-height: 550px; transition: all 0.2s ease-in-out; }
        .drag-over { background-color: #f1f5f9; border: 2.5px dashed #6366f1; transform: scale(1.01); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .chart-container { position: relative; width: 100%; height: 180px; }
    </style>
</head>
<body class="h-full flex flex-col text-slate-800">

    <nav class="bg-white border-b border-slate-200 p-4 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-slate-900">Marketing Ops Hub</h1>
            <div id="sync-status" class="text-xs font-bold text-emerald-600 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Auto-Sync Active
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto p-6">
        </main>

    <script>
        let tasks = []; 
        
        // 1. Centralized Sync Engine (Automates Push/Pull)
        async function syncEngine() {
            const url = localStorage.getItem('marketing_hub_gas_url');
            if (!url) return;

            const localTasksStr = JSON.stringify(tasks);
            const lastPushed = localStorage.getItem('marketing_last_pushed_hash');
            
            // PUSH: Only if local data changed
            if (localTasksStr !== lastPushed) {
                try {
                    await fetch(url, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tasks: tasks })
                    });
                    localStorage.setItem('marketing_last_pushed_hash', localTasksStr);
                } catch (e) { console.error("Auto-push error", e); }
            }

            // PULL: Update state from cloud
            try {
                const response = await fetch(url + "?t=" + Date.now());
                const cloudTasks = await response.json();
                if (JSON.stringify(cloudTasks) !== localTasksStr) {
                    tasks = cloudTasks;
                    renderBoard();
                }
            } catch (e) { console.error("Auto-pull error", e); }
        }

        // 2. Initialization
        window.addEventListener('DOMContentLoaded', () => {
            // Heartbeat: Sync every 5 seconds
            setInterval(syncEngine, 5000); 
            renderBoard();
        });

        // 3. Hooks: Automatically trigger syncEngine() on every update
        function drop(e, targetStage) {
            // ... existing drop logic ...
            renderBoard();
            syncEngine(); 
        }

        function handleFormSubmit(e) {
            // ... existing submit logic ...
            syncEngine(); 
        }

        function triggerDelete(e, id) {
            // ... existing delete logic ...
            syncEngine();
        }

        // [Include all your other existing helper functions: renderBoard, updateCharts, etc.]
    </script>
</body>
</html>
